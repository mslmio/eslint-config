name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      # The public copy of this repo ships no lockfile, so there is nothing for setup-node's cache to key on.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test
